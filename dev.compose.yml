services:
  postgres:
    image: postgres:17
    container_name: ai-hub-postgres
    restart: "no"
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ai-hub-postgres-data:/var/lib/postgresql/data
    networks:
      - ai-hub-network

volumes:
  ai-hub-postgres-data:

networks:
  ai-hub-network:
